# ==========================================
# PLACIFY BACKEND CONFIGURATION
# ==========================================

spring.application.name=placify-api
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/placify_db
spring.data.mongodb.auto-index-creation=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# JWT Security Configuration
placify.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
placify.app.jwtExpirationMs=86400000

# Placement Officer / Administrator Defaults
placify.admin.defaultEmail=vvitu@cds.edu
placify.admin.defaultPassword=Admin@123456
placify.admin.defaultName=VVITU CDS

# Gemini AI API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.6-flash}

# Logging
logging.level.com.placify.api=INFO
logging.level.org.springframework.data.mongodb=INFO
